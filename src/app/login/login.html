<div class="container mt-5">
  <div class="row justify-content-md-center">
    <div class="col-md-4">
      @if (error == 1) {
        <div class="alert alert-danger">
          <strong>Incorrect username or password!</strong>
        </div>
      }
      <form>
        <div class="form-group mb-3">
          <label class="form-label">Username :</label>
          <input type="text" name="username" class="form-control" [(ngModel)]="user.username">
        </div>
        <div class="form-group mb-3">
          <label class="form-label">Password :</label>
          <input type="password" name="password" class="form-control" [(ngModel)]="user.password">
        </div>
        <div class="row justify-content-md-center">
          <button type="button" (click)="onLoggedin()" class="btn btn-lg btn-primary mt-3">Login</button>
        </div>
      </form>
    </div>
  </div>
</div>
